[project]
name = "ha-powertag-gateway"
version = "0.6.3"
description = "PowerTag Gateway Integration for Home Assistant"
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = [
    "pymodbus>=3.12.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-homeassistant-custom-component>=0.13.315",
    "ruff>=0.15.1",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]             # Ignore line length violations (let formatter handle it)
